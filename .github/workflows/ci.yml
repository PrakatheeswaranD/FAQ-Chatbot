name: test-and-security

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py fact_check.py language.py prompt.py retrieval.py report.py storage.py serve.py tests
      - run: python -m unittest discover tests -v
        env:
          GROQ_API_KEY: test-key
          DATABASE_PATH: ${{ runner.temp }}/faq-chatbot-test.db
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-password
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: docker build -t kit-faq-chatbot:test .
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: kit-faq-chatbot:test
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
