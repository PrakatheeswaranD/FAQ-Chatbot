services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_PATH: /app/state/faq_chatbot.db
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      TRUST_PROXY_COUNT: 0
    ports:
      - "8000:8000"
    volumes:
      - faq_state:/app/state
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_state:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  faq_state:
  redis_state:
